name: Import a Playwright monitoring suite
on:
  workflow_dispatch:
permissions: {}
jobs:
  import:
    # An installation-owned runner and an owner session for this installation.
    # No provider credential or GitHub token is used by the import commands.
    runs-on: [self-hosted, uptime-installation]
    timeout-minutes: 5
    env:
      UPTIME_CHECKOUT: ${{ vars.UPTIME_CHECKOUT }}
      UPTIME_ORIGIN: ${{ vars.UPTIME_ORIGIN }}
      UPTIME_SUITE_DIR: ${{ vars.UPTIME_SUITE_DIR }}
      UPTIME_SESSION_COOKIE: ${{ secrets.UPTIME_SESSION_COOKIE }}
    steps:
      - name: Import, review and deploy through the definitions CLI
        shell: bash
        run: |
          set -euo pipefail
          cd "$UPTIME_CHECKOUT"
          output="$RUNNER_TEMP/uptime-playwright-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          suite="${UPTIME_SUITE_DIR:-.}"
          node scripts/definitions.mjs import-playwright --input "$suite/suite.spec.ts" --fixtures "$suite/fixtures.json" --lock "$suite/package-lock.json" --output "$output"
          node scripts/definitions.mjs preview --origin "$UPTIME_ORIGIN" --input "$output" --json > "$output.preview"
          digest=$(node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(p.counts.refused||p.counts.unsupported)process.exit(1);process.stdout.write(p.reviewDigest)' "$output.preview")
          node scripts/definitions.mjs apply --origin "$UPTIME_ORIGIN" --input "$output" --digest "$digest" --json
