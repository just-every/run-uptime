name: Verify
on:
  push:
  pull_request:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uptime-verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - id: plan
        env:
          TIER: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && 'all' || 'push' }}
        run: echo "matrix=$(node .github/scripts/verify-ci.mjs --matrix "$TIER")" >> "$GITHUB_OUTPUT"
  shards:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.20.0'
          cache: pnpm
      - name: Check edition source lock freshness
        run: node scripts/edition-authoring/cli.mjs check
      - name: Cache Chromium
        if: matrix.browser
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.cache/ms-playwright
          key: uptime-ubuntu24-${{ runner.arch }}-browser-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer install
      - name: Install Chromium and system libraries
        if: matrix.browser
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Reserve disk for native runtime journeys
        run: |
          free_kib() { df -Pk "$GITHUB_WORKSPACE" | awk 'END { print $4 }'; }
          for unused_tools in /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; do
            if [ "$(free_kib)" -ge "$((20 * 1024 * 1024))" ]; then break; fi
            sudo rm -rf -- "$unused_tools"
          done
          test "$(free_kib)" -ge "$((15 * 1024 * 1024))"
      - name: Prepare canonical temporary directory
        run: |
          node --input-type=module <<'NODE'
          import {appendFile, mkdtemp, realpath} from 'node:fs/promises';
          import {tmpdir} from 'node:os';
          import {join} from 'node:path';
          const directory = await realpath(await mkdtemp(join(tmpdir(), 'uptime-verify-')));
          await appendFile(process.env.GITHUB_ENV, `TMPDIR=${directory}\nTMP=${directory}\nTEMP=${directory}\n`);
          NODE
      - name: Run this shard
        env:
          SHARD: ${{ matrix.name }}
        run: node .github/scripts/verify-ci.mjs "$SHARD"
  verify:
    needs: [plan, shards, prepare]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every shard and the inert artifact
        env:
          PLAN: ${{ needs.plan.result }}
          SHARDS: ${{ needs.shards.result }}
          PREPARE: ${{ needs.prepare.result }}
        run: test "$PLAN" = success && test "$SHARDS" = success && test "$PREPARE" = success
  prepare:
    # This job has no provider credentials and never deploys. Its artifact must
    # pass independent source, run and digest checks in a trusted controller.
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0
      - name: Install and package without credential environment
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/uptime-package-$RUN_ID-$RUN_ATTEMPT"
          install_home="$RUNNER_TEMP/uptime-install-home-$RUN_ID-$RUN_ATTEMPT"
          prepare_home="$RUNNER_TEMP/uptime-prepare-home-$RUN_ID-$RUN_ATTEMPT"
          test ! -e "$bundle"
          test ! -e "$install_home"
          test ! -e "$prepare_home"
          mkdir -m 700 "$bundle" "$install_home"
          mkdir -m 700 "$bundle/tmp"
          trap 'rm -rf "$install_home" "$prepare_home" "$bundle/tmp"' EXIT
          if git config --local --name-only --get-regexp '(extraheader|credential|sshcommand)'; then
            echo 'Checkout retained credential configuration' >&2
            exit 1
          fi
          env -i PATH="$PATH" HOME="$install_home" CI=true TMPDIR="$bundle/tmp" \
            GIT_CONFIG_NOSYSTEM=1 WRANGLER_SEND_METRICS=false \
            CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV=false sh -c 'pnpm install --frozen-lockfile && exec pnpm exec rer "$@"' sh install
          env -i PATH="$PATH" HOME="$install_home" CI=true TMPDIR="$bundle/tmp" \
            GIT_CONFIG_NOSYSTEM=1 WRANGLER_SEND_METRICS=false \
            CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV=false \
            RER_PREPARE_ISOLATION=ephemeral-credential-free-job \
            RER_PREPARE_HOME="$prepare_home" RER_DEPLOY_ARTIFACT="$bundle/artifact.json" \
            RER_DEPLOY_SOURCE_SHA="$SOURCE_SHA" RER_DEPLOY_RUN_ID="$RUN_ID" \
            RER_DEPLOY_RUN_ATTEMPT="$RUN_ATTEMPT" node scripts/deployment/prepare.mjs
          (cd "$bundle" && sha256sum artifact.json > artifact.sha256)
      - name: Retain inert deployment artifact and digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uptime-deploy-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/uptime-package-${{ github.run_id }}-${{ github.run_attempt }}/artifact.json
            ${{ runner.temp }}/uptime-package-${{ github.run_id }}-${{ github.run_attempt }}/artifact.sha256
          if-no-files-found: error
          retention-days: 7
