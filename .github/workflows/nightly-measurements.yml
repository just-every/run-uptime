name: Nightly notification measurements
'on':
  schedule:
    - cron: 43 6 * * 1,4
permissions:
  contents: read
concurrency:
  group: uptime-nightly-notification-measurements
  cancel-in-progress: false
jobs:
  notification-measurements:
    name: Notification measurements (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        mode:
          - normal
          - cpu
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    steps:
      - name: Set runner-owned browser cache
        run: printf 'PLAYWRIGHT_BROWSERS_PATH=%s/ms-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - name: Set runner-owned pnpm store
        run: pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
      - name: Cache runner-owned dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: uptime-ubuntu24-temp-store-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.20.0
          package-manager-cache: false
      - run: node scripts/edition-authoring/cli.mjs check
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer install
      - name: Install Chromium and probe bundled engine
        run: bash .github/scripts/install-browsers.sh
      - name: Build exact checkout once
        run: pnpm run build
      - name: Measure notifications-2 (30 normal or 10 page CPU-throttled samples)
        run: node .github/scripts/measure-notifications.mjs '${{ matrix.mode }}'
      - name: Retain every sample including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uptime-notification-measurements-${{ matrix.mode }}-${{ github.sha }}-${{ github.run_id }}
          path: data/notification-measurements/
          if-no-files-found: warn
          retention-days: 14
