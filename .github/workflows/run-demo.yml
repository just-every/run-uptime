name: Run demo
on:
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Deploy a separate demo-test environment with Turnstile test keys'
        type: boolean
        default: false
      observe:
        description: 'Observe test-host admissions for 15 minutes before a start cohort'
        type: boolean
        default: false
      remove_test:
        description: 'Remove the separate test demo and read back resource absence (requires test_only)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: run-demo-${{ inputs.test_only && 'test' || 'production' }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.RUN_DEMO_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: run-demo
    steps:
      - name: Require the test environment for removal
        if: inputs.remove_test
        run: test "$TEST_ONLY" = true
        env:
          TEST_ONLY: ${{ inputs.test_only }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: corepack enable && pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      - name: Scope test deployment
        if: inputs.test_only
        run: node --input-type=module -e "import fs from 'node:fs'; const p='deploy-demo.json'; const d=JSON.parse(fs.readFileSync(p)); d.domain='test.run-uptime.com'; fs.writeFileSync(p,JSON.stringify(d));"
      - name: Prepare demo image variables
        if: ${{ !inputs.remove_test }}
        run: node scripts/demo/configure-image.mjs
      - name: Deploy demo
        if: ${{ !inputs.remove_test }}
        run: pnpm exec rer deploy --demo --environment "$DEMO_ENVIRONMENT"
        env:
          DEMO_ENVIRONMENT: ${{ inputs.test_only && 'demo-test' || 'production' }}
          CLOUDFLARE_ACCOUNT_ID: b20c0ca9cab0c2b70e13d7cf724b89bd
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURNSTILE_SITE_KEY: ${{ inputs.test_only && '1x00000000000000000000AA' || vars.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ inputs.test_only && '1x0000000000000000000000000000000AA' || secrets.TURNSTILE_SECRET_KEY }}
          RER_DEMO_OPERATOR_TOKEN: ${{ secrets.RER_DEMO_OPERATOR_TOKEN }}
      - name: Remove test demo and confirm absence
        if: inputs.remove_test
        env:
          CLOUDFLARE_ACCOUNT_ID: b20c0ca9cab0c2b70e13d7cf724b89bd
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          pnpm exec rer deploy --demo --environment demo-test --remove --yes
          pnpm exec rer deploy --demo --environment demo-test --remove --yes
      - name: Public readback
        if: ${{ !inputs.remove_test }}
        run: |
          domain=demo.$(node -p "require('./deploy-demo.json').domain")
          status=$(curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --retry-max-time 120 --max-time 10 -D "$RUNNER_TEMP/demo-start.headers" -o /dev/null -w '%{http_code}' "https://$domain/")
          test "$status" = 200
          ! grep -qi '^set-cookie:' "$RUNNER_TEMP/demo-start.headers"
      - name: Observe test-host admissions
        if: inputs.test_only && inputs.observe && !inputs.remove_test
        run: node scripts/demo/observe.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: b20c0ca9cab0c2b70e13d7cf724b89bd
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Save admission observation
        if: always() && inputs.test_only && inputs.observe && !inputs.remove_test
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: demo-admissions
          path: .rer/demo-observation/admissions.jsonl
          include-hidden-files: true
